<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOF Live Quiz Prototype</title><style>body{font-family:Segoe UI,Arial;margin:0;background:#fff5f6;color:#24242a}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #eee;border-radius:18px;padding:24px;box-shadow:0 12px 34px #7b132018}h1{color:#e31837}.red{background:#e31837;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}.ans{width:100%;text-align:left;padding:14px;margin:7px 0;border:2px solid #eee;border-radius:12px;background:white;cursor:pointer}.ans:hover{border-color:#e31837}.code{font-size:36px;font-weight:900;letter-spacing:6px}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#ffe8ec;color:#c61531;font-weight:800}.board{display:grid;grid-template-columns:1fr auto;gap:8px}.timer{font-size:42px;font-weight:900;color:#e31837}.muted{color:#6c717d}</style></head><body><div class="wrap"><div class="card" id="app"></div></div><script>const QS=[{"id": "G23_75", "q": "Anh A tham gia bảo hiểm nhân thọ với quyền lợi tử vong là 500 triệu đồng, quyền lợi tử vong do tai nạn giao thông công cộng được chi trả thêm 200% quyền lợi tử vong. Trường hợp anh A tử vong do tai nạn giao thông công cộng, quyền lợi bảo hiểm được chi trả là:", "o": ["500 triệu đồng.", "1 tỷ đồng.", "1,5 tỷ đồng.", "2 tỷ đồng."], "a": 2, "exp": "Đáp án C đúng vì nội dung phù hợp là: C: 1,5 tỷ đồng.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G23_184", "q": "Chọn phương án đúng về thời hạn bảo hiểm:", "o": ["Là khoảng thời gian mà nếu sự kiện bảo hiểm xảy ra, người được bảo hiểm không được nhận quyền lợi bảo hiểm.", "Là thời gian bên mua bảo hiểm đóng phí bảo hiểm cho doanh nghiệp theo thỏa thuận tại hợp đồng bảo hiểm.", "Là thời gian có hiệu lực của hợp đồng bảo hiểm và được ghi trên giấy chứng nhận bảo hiểm.", ""], "a": 2, "exp": "Đáp án C đúng vì nội dung phù hợp là: C: Là thời gian có hiệu lực của hợp đồng bảo hiểm và được ghi trên giấy chứng nhận bảo hiểm.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G22_38", "q": "Theo Luật Kinh doanh bảo hiểm, tổ chức, cá nhân được bên mua bảo hiểm hoặc người được bảo hiểm chỉ định để nhận tiền bảo hiểm theo thỏa thuận trong hợp đồng bảo hiểm là:", "o": ["Người được bảo hiểm.", "Người thụ hưởng.", "Người bảo hiểm.", "Người tham gia bảo hiểm."], "a": 1, "exp": "Đáp án B đúng vì nội dung phù hợp là: B: Người thụ hưởng.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G23_154", "q": "Chi phí nào sau đây được coi là chi phí y tế hợp lý, hợp lệ có thể được các doanh nghiệp bảo hiểm chi trả trong bảo hiểm sức khỏe?", "o": ["Chi phí mua các thực phẩm chức năng hỗ trợ điều trị theo chỉ định của bác sỹ.", "Chi phí phẫu thuật thẩm mĩ.", "Chi phí phẫu thuật nội trú do ốm đau, bệnh tật.", ""], "a": 2, "exp": "Đáp án C đúng vì nội dung phù hợp là: C: Chi phí phẫu thuật nội trú do ốm đau, bệnh tật.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G23_98", "q": "Theo Luật Kinh doanh bảo hiểm, đối tượng của hợp đồng bảo hiểm sức khỏe là:", "o": ["Sức khoẻ con người.", "Tuổi thọ, tính mạng, sức khỏe và tai nạn con người.", "Sức khỏe và tai nạn con người.", "Tính mạng và trách nhiệm dân sự của người được bảo hiểm."], "a": 0, "exp": "Đáp án A đúng vì nội dung phù hợp là: A: Sức khoẻ con người.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G22_61", "q": "Rủi ro thuần túy là rủi ro có hậu quả:", "o": ["Liên quan đến khả năng đầu cơ.", "Liên quan đến khả năng tổn thất.", "Liên quan đến khả năng đầu cơ và khả năng tổn thất.", "Không phương án nào đúng."], "a": 1, "exp": "Đáp án B đúng vì nội dung phù hợp là: B: Liên quan đến khả năng tổn thất.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G23_99", "q": "Người được bảo hiểm tham gia bảo hiểm chăm sóc sức khỏe với hạn mức 2 triệu đồng/1 ngày nằm viện. Người được bảo hiểm nằm viện 3 ngày. Tổng chi phí nằm viện khi xuất viện là 7 triệu đồng. Doanh nghiệp hiểm chi trả số tiền là:", "o": ["7 triệu đồng", "6 triệu đồng", "2 triệu đồng", ""], "a": 1, "exp": "Đáp án B đúng vì nội dung phù hợp là: B: 6 triệu đồng. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G22_142", "q": "Lựa chọn đáp án đúng về các loại nghiệp vụ bảo hiểm nhân thọ:", "o": ["Bảo hiểm trọn đời, bảo hiểm sinh kỳ, bảo hiểm tử kỳ, bảo hiểm hỗn hợp, bảo hiểm trả tiền định kỳ, bảo hiểm liên kết đầu tư, bảo hiểm hưu trí.", "Bảo hiểm trọn đời, bảo hiểm sinh kỳ, bảo hiểm tử kỳ, bảo hiểm hỗn hợp, bảo hiểm trả tiền định kỳ, bảo hiểm liên kết đầu tư, bảo hiểm bảo lãnh.", "Bảo hiểm trọn đời, bảo hiểm sinh kỳ, bảo hiểm tử kỳ, bảo hiểm sức khỏe, bảo hiểm trả tiền định kỳ, bảo hiểm liên kết đầu tư, bảo hiểm bảo lãnh.", "Bảo hiểm trọn đời, bảo hiểm sinh kỳ, bảo hiểm tử kỳ, bảo hiểm sức khỏe, bảo hiểm liên kết đầu tư, bảo hiểm bảo lãnh."], "a": 0, "exp": "Đáp án A đúng vì nội dung phù hợp là: A: Bảo hiểm trọn đời, bảo hiểm sinh kỳ, bảo hiểm tử kỳ, bảo hiểm hỗn hợp, bảo hiểm trả tiền định kỳ, bảo hiểm liên kết đầu tư, bảo hiểm hưu trí.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G22_122", "q": "Rủi ro ngẫu nhiên là gì?", "o": ["Bất ngờ", "Không lường trước được về không gian, thời gian, cũng như mức độ nghiêm trọng", "Cả A và B đều đúng", ""], "a": 2, "exp": "Đáp án C đúng vì nội dung phù hợp là: C: Cả A và B đều đúng. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G23_250", "q": "Quyền lợi thương tật toàn bộ vĩnh viễn trong bảo hiểm sức khỏe:", "o": ["Người được bảo hiểm bị liệt hoàn toàn và không thể phục hồi một tay và một chân", "Người được bảo hiểm bị liệt hoàn toàn và không thể phục hồi một tay hoặc một chân", "Người được bảo hiểm bị liệt hoàn toàn và không thể phục hồi một tay và một mắt", "A, C đúng"], "a": 3, "exp": "Đáp án D đúng vì nội dung phù hợp là: D: A, C đúng. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G26_30", "q": "Theo Luật Kinh doanh bảo hiểm bắt buộc bao gồm:", "o": ["Bảo hiểm bắt buộc người ngồi trên xe cơ giới", "Bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới", "Bảo hiểm bắt buộc thiệt hại vật chất xe cơ giới", "A, B, C đúng"], "a": 1, "exp": "Đáp án B đúng vì nội dung phù hợp là: B: Bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G22_26", "q": "Bảo hiểm là phương pháp phòng tránh rủi ro nào sau đây:", "o": ["Giữ lại rủi ro.", "Né tránh rủi ro.", "Kiểm soát rủi ro.", "Chuyển giao rủi ro."], "a": 3, "exp": "Đáp án D đúng vì nội dung phù hợp là: D: Chuyển giao rủi ro.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G23_183", "q": "Trong bảo hiểm sức khỏe, thời gian chờ không áp dụng cho trường hợp điều trị nào sau đây?", "o": ["Điều trị do tai nạn.", "Điều trị các bệnh mãn tính.", "Điều trị viêm đường hô hấp.", "Điều trị ốm đau."], "a": 0, "exp": "Đáp án A đúng vì nội dung phù hợp là: A: Điều trị do tai nạn.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 2}, {"id": "G22_132", "q": "Ông A dự kiến bay từ Hà Nội và TP Hồ Chí Minh vào ngày 01/03/2024, tuy nhiên vào 01/03/2024 theo dự báo thời tiết sẽ có bão to, vì vậy ông A lùi lịch bay sang ngày 03/03/2024. Lựa chọn này của ông A là biện pháp phòng tránh rủi ro nào sau đây:", "o": ["Né tránh rủi ro.", "Kiểm soát rủi ro.", "Chấp nhận rủi ro.", "Đánh giá rủi ro."], "a": 0, "exp": "Đáp án A đúng vì nội dung phù hợp là: A: Né tránh rủi ro.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G23_93", "q": "Theo Luật Kinh doanh bảo hiểm, bảo hiểm sức khỏe là loại hình bảo hiểm cho trường hợp:", "o": ["Người được bảo hiểm sống đến một thời hạn nhất định.", "Người được bảo hiểm chết trong một thời hạn nhất định.", "Người được bảo hiểm bị thương tật, tai nạn, ốm đau, bệnh tật hoặc chết vào bất kỳ thời điểm nào trong suốt cuộc đời của người đó.", "Người được bảo hiểm bị thương tật, tai nạn, ốm đau, bệnh tật hoặc chăm sóc sức khỏe."], "a": 3, "exp": "Đáp án D đúng vì nội dung phù hợp là: D: Người được bảo hiểm bị thương tật, tai nạn, ốm đau, bệnh tật hoặc chăm sóc sức khỏe.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G23_95", "q": "Quyền lợi miễn thu phí trong hợp đồng bảo hiểm nhân thọ là quyền lợi bảo hiểm, theo đó:", "o": ["Doanh nghiệp bảo hiểm miễn toàn bộ nghĩa vụ nộp phí còn lại của hợp đồng bảo hiểm cho bên mua bảo hiểm khi sự kiện bảo hiểm xảy ra.", "Trong thời gian miễn thu phí, hợp đồng bảo hiểm vẫn có hiệu lực và bên mua bảo hiểm vẫn được hưởng các quyền lợi bảo hiểm theo đúng thỏa thuận tại hợp đồng bảo hiểm.", "Doanh nghiệp bảo hiểm miễn một phần nghĩa vụ nộp phí còn lại của hợp đồng bảo hiểm cho bên mua bảo hiểm khi sự kiện bảo hiểm xảy ra.", "A, B đúng."], "a": 3, "exp": "Đáp án D đúng vì nội dung phù hợp là: D: A, B đúng.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G22_90", "q": "Đáp án nào sau đây là đúng khi nói về bảo hiểm trả tiền định kỳ:", "o": ["Là nghiệp vụ bảo hiểm cho trường hợp người được bảo hiểm chết trong thời hạn hợp đồng.", "Là nghiệp vụ bảo hiểm cho trường hợp người được bảo hiểm bị tai nạn, ốm đau, mất khả năng lao động.", "Là nghiệp vụ bảo hiểm cho trường hợp người được bảo hiểm sống đến một thời hạn nhất định, sau đó doanh nghiệp bảo hiểm phải trả tiền bảo hiểm định kỳ cho người thụ hưởng theo thỏa thuận trong hợp đồng bảo hiểm.", "A, B đúng."], "a": 2, "exp": "Đáp án C đúng vì nội dung phù hợp là: C: Là nghiệp vụ bảo hiểm cho trường hợp người được bảo hiểm sống đến một thời hạn nhất định, sau đó doanh nghiệp bảo hiểm phải trả tiền bảo hiểm định kỳ cho người thụ hưởng theo thỏa thuận trong hợp đồng bảo hiểm.. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 1}, {"id": "G23_252", "q": "Trong bảo hiểm nhân thọ, việc chứng nhận bị liệt hoàn toàn và không thể phục hồi chức năng của các bộ phận có thể được thực hiện:", "o": ["Ngay sau khi sự kiện bảo hiểm", "Sau khi kết thúc việc điều trị", "Không sớm hơn 180 ngày kể từ ngày xảy ra sự kiện bảo hiểm", "A, B đúng"], "a": 2, "exp": "Đáp án C đúng vì nội dung phù hợp là: C: Không sớm hơn 180 ngày kể từ ngày xảy ra sự kiện bảo hiểm. Chủ đề được đối chiếu với mạch kiến thức OB 2.", "mult": 2}];const C=new BroadcastChannel('mof-live-demo');let state=JSON.parse(localStorage.getItem('mofstate')||'null')||{code:'397097',i:0,started:false,startAt:0,answers:{},players:{}};function save(){localStorage.setItem('mofstate',JSON.stringify(state));C.postMessage(state)}C.onmessage=e=>{state=e.data;render()};function score(ms,m){let sec=Math.min(20,ms/1000);return Math.max(100,Math.round((1000-(sec/20)*900)*m))}let me=localStorage.getItem('mofname')||'';function join(){let n=document.getElementById('name').value.trim();if(!n)return;me=n;localStorage.setItem('mofname',n);state.players[n]=state.players[n]||{score:0};save();render()}function render(){let A=document.getElementById('app');if(!me){A.innerHTML=`<h1>THAM GIA MOF LIVE QUIZ</h1><p>Mã phòng: <b>${state.code}</b></p><input id="name" placeholder="Nhập tên" style="padding:12px;width:70%"> <button class="red" onclick="join()">Vào chơi</button>`;return}let q=QS[state.i],done=state.answers[me];A.innerHTML=`<span class="pill">${q.mult===2?'⭐ CÂU x2 ĐIỂM':'1000 ĐIỂM TỐI ĐA'}</span><h1>Câu ${state.i+1}/20</h1><h2>${q.q}</h2>${state.started&&!done?q.o.map((x,i)=>x?`<button class="ans" onclick="pick(${i})"><b>${'ABCD'[i]}</b> ${x}</button>`:'').join(''):done?`<h2>Đã chốt đáp án. ${done.correct?'✓ Chính xác':'✕ Chưa đúng'}</h2><p>${done.points||0} điểm</p>`:'<p class="muted">Chờ giảng viên bấm Bắt đầu 20s...</p>'}`};function pick(i){if(!state.started||state.answers[me])return;let q=QS[state.i],elapsed=Date.now()-state.startAt;if(elapsed>20000)return;let ok=i===q.a,pts=ok?score(elapsed,q.mult):0;state.answers[me]={i,correct:ok,points:pts,elapsed};state.players[me].score=(state.players[me].score||0)+pts;save();render()}render();</script></body></html>
